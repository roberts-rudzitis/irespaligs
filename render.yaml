# Render Blueprint – everything in Frankfurt (EU). See README "Deploying".
# Field names and plan IDs checked against https://render.com/docs/blueprint-spec on 31.10.2026.
# `sync: false` = Render asks you for the value when the Blueprint is first created.
services:
  - type: web
    name: irespaligs-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. irespaligs.lv,irespaligs-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://irespaligs.lv
      - key: DJANGO_ADMIN_URL
        sync: false # e.g. office-7f3k/
      - key: DATABASE_URL
        fromDatabase:
          name: irespaligs-db
          property: connectionString
      - key: SUPPORT_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false

  # Daily reminders. Render's docs don't state the cron timezone; assuming UTC:
  # 05:00 UTC = 07:00 Riga in winter, 08:00 in summer. Check the first run time in the dashboard.
  - type: cron
    name: irespaligs-reminders
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 5 * * *"
    dockerCommand: python manage.py send_reminders
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true # not shared with the web app; the reminder job signs nothing
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: DATABASE_URL
        fromDatabase:
          name: irespaligs-db
          property: connectionString
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: irespaligs-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17" # same as local development (docker-compose.yml)
    databaseName: irespaligs
    user: irespaligs
