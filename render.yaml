# Render Blueprint – everything in Frankfurt (EU). See README "Deploying".
# TODO: verify field names and plans against current Render docs before first deploy.
services:
  - type: web
    name: irespaligs-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. irespaligs.lv,irespaligs-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://irespaligs.lv
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: irespaligs-db
          property: connectionString
      - key: SUPPORT_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false

  # Daily reminders: 05:00 UTC = 07:00 Riga in winter, 08:00 in summer
  - type: cron
    name: irespaligs-reminders
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "0 5 * * *"
    dockerCommand: python manage.py send_reminders
    envVars:
      - fromGroup: irespaligs-shared # create in the dashboard with the same variables as the web service

databases:
  - name: irespaligs-db
    region: frankfurt
    plan: basic-256mb
    databaseName: irespaligs
    user: irespaligs
